<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conquista el plano cartesiano</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c172b;color:#e8efff;font:17px system-ui}main{max-width:850px;margin:auto;padding:24px}h1{font-size:clamp(24px,5vw,38px);margin:8px 0}small{color:#9cb4d4}.panel{background:#152641;border:1px solid #344966;border-radius:18px;padding:20px;margin:16px 0}button,input,select{font:inherit;border-radius:9px;padding:10px 14px;border:1px solid #61799a}button{background:#68e2cb;color:#092a2d;font-weight:bold;cursor:pointer;margin:4px}button.secondary{background:#253b59;color:white}button:disabled{opacity:.45;cursor:default}input,select{background:#0d1b30;color:white;max-width:100%}input.answer{width:115px}label{display:inline-block;margin:8px}svg{width:100%;max-height:390px;background:#f8fafc;border-radius:12px}progress{width:100%;accent-color:#68e2cb;height:14px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.formula{font-size:25px;font-weight:700;color:#9fffe6}#feedback{white-space:pre-line;line-height:1.55}#hint{color:#ffe19b} .hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #41536e;padding:8px} </style><main><small>MATEMÁTICAS · 3.º DE SECUNDARIA</small><h1>Conquista el plano cartesiano</h1><div id="start" class="panel"><p>Supera 5 retos de pendientes y 5 retos de vértices. Tendrás dos intentos por reto y una pista opcional. Cada acierto vale 10 puntos; si agotas los intentos, recibirás la solución y avanzarás sin puntos.</p><label>Nombre del estudiante<br><input id="name" placeholder="Escribe tu nombre"></label><button id="begin">Comenzar misión</button></div><section id="game" class="hidden"><div class="panel"><div class="stats"><strong id="level"></strong><span id="score"></span><span id="clock">00:00</span></div><progress id="progress" max="10" value="0"></progress><small id="counter"></small></div><div class="panel"><h2 id="question"></h2><div class="formula" id="formula"></div><svg id="graph" viewBox="0 0 520 360" role="img" aria-label="Gráfica de la función"></svg><form id="form"><div id="fields"></div><button id="check" type="submit">Comprobar</button><button type="button" class="secondary" id="help">Necesito una pista</button></form><p id="hint" hidden></p><p id="feedback" aria-live="polite"></p><button id="next" hidden>Siguiente reto →</button></div></section><section id="end" class="panel hidden"><h2>Misión terminada</h2><p id="result"></p><div id="report"></div><button id="save">Descargar evidencia</button><button class="secondary" onclick="location.reload()">Volver a jugar</button></section></main><script>
const $=id=>document.getElementById(id);const qs=[
{m:2,b:1,f:'y = 2x + 1',p:[0,2]}, {m:-3,b:2,f:'y = −3x + 2',p:[0,1]}, {m:.5,b:-2,f:'y = ½x − 2',p:[0,4]}, {m:0,b:3,f:'y = 3',p:[-2,2]}, {m:-1.5,b:1,f:'y = −(3/2)x + 1',p:[-2,2]},
{a:1,b:-4,c:3,f:'y = x² − 4x + 3'}, {a:-1,b:6,c:-5,f:'y = −x² + 6x − 5'}, {a:2,b:8,c:5,f:'y = 2x² + 8x + 5'}, {a:-2,b:-4,c:1,f:'y = −2x² − 4x + 1'}, {a:1,b:-3,c:2,f:'y = x² − 3x + 2'}];
let i=0,score=0,tries=0,started=0,results=[],done=false,student='';const fmt=n=>String(Math.round(n*10000)/10000);const calc=(q,x)=>q.a===undefined?q.m*x+q.b:q.a*x*x+q.b*x+q.c;const vertex=q=>{let x=-q.b/(2*q.a);return [x,calc(q,x)]};
function graph(q){let s=$('graph'),xmin=-6,xmax=6,ymin=-10,ymax=10,L=42,R=500,T=12,B=330;const X=x=>L+(x-xmin)*(R-L)/(xmax-xmin),Y=y=>B-(y-ymin)*(B-T)/(ymax-ymin);let h='<defs><clipPath id="plot"><rect x="42" y="12" width="458" height="318"/></clipPath></defs>';for(let x=xmin;x<=xmax;x++){h+=`<path d="M${X(x)} ${T}V${B}" stroke="#dbe3ec"/><text x="${X(x)}" y="${Y(0)+15}" text-anchor="middle" font-size="10" fill="#475569">${x||''}</text>`}for(let y=ymin;y<=ymax;y+=2){h+=`<path d="M${L} ${Y(y)}H${R}" stroke="#dbe3ec"/><text x="${X(0)-8}" y="${Y(y)+4}" text-anchor="end" font-size="10" fill="#475569">${y||''}</text>`}h+=`<path d="M${L} ${Y(0)}H${R} M${X(0)} ${T}V${B}" stroke="#334155" stroke-width="1.5"/><text x="505" y="${Y(0)-5}" font-size="13">x</text><text x="${X(0)+6}" y="11" font-size="13">y</text><g clip-path="url(#plot)"><path d="`;for(let j=0;j<=240;j++){let x=xmin+(xmax-xmin)*j/240;h+=(j?' L':'M')+X(x)+' '+Y(calc(q,x))}h+='" fill="none" stroke="#087e9c" stroke-width="3"/>';if(q.p)for(let x of q.p){let y=calc(q,x);h+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#e75b32"/><text x="${X(x)+9}" y="${Y(y)-8}" font-size="13" fill="#9a3412">(${x}, ${fmt(y)})</text>`}s.innerHTML=h+'</g>'}
function render(){let q=qs[i];tries=0;done=false;$('level').textContent=i<5?'Nivel 1 · Pendientes':'Nivel 2 · Vértices';$('counter').textContent=`Reto ${i+1} de 10 · Dos intentos disponibles`;$('score').textContent=score+' / 100 puntos';$('progress').value=i;$('question').textContent=i<5?'¿Cuál es la pendiente de la recta?':'¿Cuál es el vértice y qué tipo de extremo tiene?';$('formula').textContent=q.f;graph(q);$('fields').innerHTML=i<5?'<label>Pendiente m <input class="answer" id="m" required inputmode="text" placeholder="Ej. 1/2"></label>':'<label>x del vértice <input class="answer" id="vx" required inputmode="text"></label><label>y del vértice <input class="answer" id="vy" required inputmode="text"></label><label>Tipo <select id="type" required><option value="">Elige</option><option>Máximo</option><option>Mínimo</option></select></label>';$('hint').hidden=true;$('feedback').textContent='';$('next').hidden=true;$('check').disabled=false;$('help').disabled=false;}
function number(s){s=s.trim().replace(/−/g,'-').replace(/,/g,'.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;let p=s.split('/').map(Number);return p.length===2?p[0]/p[1]:p[0]};const eq=(a,b)=>Number.isFinite(a)&&Math.abs(a-b)<1e-7;
function solution(q){if(q.p){let [x1,x2]=q.p,y1=calc(q,x1),y2=calc(q,x2);return `m = (y₂ − y₁)/(x₂ − x₁) = (${fmt(y2)} − (${fmt(y1)}))/(${x2} − (${x1})) = ${fmt(q.m)}.`}let [x,y]=vertex(q);return `xᵥ = −b/(2a) = −(${q.b})/(2 × (${q.a})) = ${fmt(x)}.\nyᵥ = f(${fmt(x)}) = ${fmt(y)}.\nVértice: (${fmt(x)}, ${fmt(y)}). Como a ${q.a>0?'>':'<'} 0, es un ${q.a>0?'mínimo':'máximo'}.`}
$('begin').onclick=()=>{student=$('name').value.trim()||'Estudiante';$('start').classList.add('hidden');$('game').classList.remove('hidden');started=Date.now();render()};function time(){let t=Math.floor((Date.now()-started)/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}setInterval(()=>{if(started&&!$('game').classList.contains('hidden'))$('clock').textContent=time()},500);
$('help').onclick=()=>{let q=qs[i];$('hint').textContent=i<5?'Pista: elige los dos puntos marcados. Divide el cambio vertical entre el cambio horizontal: m = (y₂ − y₁)/(x₂ − x₁). También puedes identificar el coeficiente de x.':'Pista: calcula xᵥ = −b/(2a), sustituye ese valor en la función para obtener yᵥ y observa hacia dónde abre la parábola.';$('hint').hidden=false};
$('form').onsubmit=e=>{e.preventDefault();if(done)return;let q=qs[i],correct,answer;if(i<5){let n=number($('m').value);if(!Number.isFinite(n)){ $('feedback').textContent='Escribe un número válido, decimal o fracción.';return}correct=eq(n,q.m);answer=$('m').value}else{let x=number($('vx').value),y=number($('vy').value);if(!Number.isFinite(x)||!Number.isFinite(y)){ $('feedback').textContent='Escribe coordenadas numéricas válidas.';return}correct=eq(x,vertex(q)[0])&&eq(y,vertex(q)[1])&&$('type').value===(q.a>0?'Mínimo':'Máximo');answer=`(${$('vx').value}, ${$('vy').value}), ${$('type').value}`};tries++;if(!correct&&tries<2){$('feedback').textContent='Todavía no. Revisa tus cálculos; tienes un intento más.';$('counter').textContent=`Reto ${i+1} de 10 · Un intento disponible`;return}done=true;if(correct)score+=10;results.push({f:q.f,answer,correct,tries,solution:solution(q)});$('score').textContent=score+' / 100 puntos';$('progress').value=i+1;$('feedback').textContent=(correct?'¡Excelente! +10 puntos.':'Se agotaron los intentos. +0 puntos.')+'\n'+solution(q);$('check').disabled=true;$('help').disabled=true;$('next').hidden=false;$('next').textContent=i===9?'Ver resultados':'Siguiente reto →'};
let finalTime='';$('next').onclick=()=>{i++;if(i<10){render();return}finalTime=time();$('game').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent=`${student}: ${score}/100 puntos · ${score/10} de 10 aciertos · Tiempo: ${finalTime}`;let table=document.createElement('table');table.innerHTML='<tr><th>Función</th><th>Resultado</th><th>Intentos</th></tr>';for(let r of results){let tr=table.insertRow();for(let v of [r.f,r.correct?'Correcto':'Por reforzar',r.tries])tr.insertCell().textContent=v}$('report').append(table)};
$('save').onclick=()=>{let content=`Conquista el plano cartesiano\nEstudiante: ${student}\nPuntaje: ${score}/100\nTiempo: ${finalTime}\n\n`+results.map((r,j)=>`${j+1}. ${r.f}\nRespuesta: ${r.answer}\nResultado: ${r.correct?'Correcto':'Por reforzar'}; intentos: ${r.tries}\nSolución: ${r.solution}`).join('\n\n');let u=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='evidencia_matematicas.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
